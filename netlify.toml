[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdfkit"]

[functions.reminders]
  schedule = "*/10 * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/api/"
  status = 200
